<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>نايف للأغذية - تقرير تجميع الأصناف</title>
    <!-- مكتبات خارجية -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- خطوط وأساسيات -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fb;
            font-family: 'Segoe UI', 'Tahoma', 'Roboto', system-ui, sans-serif;
            padding: 30px 20px;
            color: #1e2a3a;
        }

        .main-container {
            max-width: 1300px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 28px 32px 40px;
            transition: all 0.2s;
        }

        /* رأس الشركة */
        .company-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            border-bottom: 2px solid #ffc107;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .company-logo {
            height: 70px;
            width: auto;
            object-fit: contain;
            border-radius: 16px;
            background: #fff3e0;
            padding: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .company-name {
            font-size: 1.7rem;
            font-weight: 800;
            background: linear-gradient(135deg, #c0392b, #e67e22);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }
        .upload-area {
            background: #fef3e8;
            border-radius: 60px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .file-label {
            background: #d32f2f;
            color: white;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            border: none;
        }
        .file-label:hover {
            background: #b71c1c;
            transform: scale(1.02);
        }
        #fileInput {
            display: none;
        }
        .file-status {
            color: #2c3e50;
            font-weight: 500;
            font-size: 0.85rem;
        }

        /* أزرار التصدير */
        .action-buttons {
            display: flex;
            gap: 18px;
            justify-content: flex-end;
            margin: 25px 0 20px;
        }
        .btn-excel {
            background: #1e7e34;
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-pdf {
            background: #c0392b;
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .btn-excel:hover, .btn-pdf:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }
        .btn-excel:disabled, .btn-pdf:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        /* جدول النتائج */
        .report-table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            background: white;
            margin-top: 10px;
        }
        .summary-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            font-family: monospace;
        }
        .summary-table th {
            background: #2c3e50;
            color: white;
            padding: 14px 12px;
            font-weight: 600;
            font-size: 0.9rem;
            border-left: 1px solid #3e5a6b;
        }
        .summary-table td {
            padding: 12px 12px;
            border-bottom: 1px solid #e9ecef;
            text-align: center;
            background-color: #fff;
        }
        .summary-table tr:hover td {
            background-color: #fef5e7;
        }
        .summary-table th:first-child, .summary-table td:first-child {
            text-align: right;
            font-weight: 500;
        }
        .total-row {
            background: #f1f9fe;
            font-weight: 700;
        }
        .no-data-msg {
            text-align: center;
            padding: 50px;
            color: #7f8c8d;
            font-size: 1rem;
        }

        /* توقيع المطور (عائم) */
        .signature-card {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: linear-gradient(135deg, #FF6E00, #2196F3);
            color: white;
            padding: 10.5px 17.5px;
            border-radius: 8.5px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            z-index: 1000;
            animation: float 6s ease-in-out infinite;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.2);
            text-decoration: none;
            color: inherit;
            display: inline-block;
        }
        .signature-card:hover { 
            transform: scale(1.05); 
            box-shadow: 0 12px 35px rgba(0,0,0,0.4); 
        }
        @keyframes float { 
            0% { transform: translateY(0px); } 
            50% { transform: translateY(-15px); } 
            100% { transform: translateY(0px); } 
        }
        .signature-card::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(135deg, #80EF80, #2196F3);
            border-radius: 14px;
            z-index: -1;
            animation: borderGlow 3s linear infinite;
            background-size: 400%;
        }
        @keyframes borderGlow { 
            0% { background-position: 0% 50%; } 
            50% { background-position: 100% 50%; } 
            100% { background-position: 0% 50%; } 
        }
        .signature-card .name { 
            font-size: 0.95rem; 
            font-weight: 700; 
            margin-bottom: 5px; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3); 
        }
        .signature-card .title { 
            font-size: 0.7rem; 
            opacity: 0.9; 
            font-weight: 500; 
        }
        @media (max-width: 768px) { 
            .signature-card { 
                position: relative; 
                bottom: auto; 
                left: auto; 
                margin: 30px auto 0; 
                width: fit-content; 
                animation: none; 
            } 
        }
        @media print {
            .signature-card { display: none; }
            .action-buttons, .upload-area, .file-label { display: none; }
        }
        footer {
            margin-top: 15px;
            text-align: center;
            font-size: 0.7rem;
            color: #aaa;
        }
        .badge-count {
            background: #e67e22;
            color: white;
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 0.7rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="main-container">
    <div class="company-header">
        <div class="logo-area">
            <img id="companyLogoImg" class="company-logo" src="https://i.postimg.cc/NM2zJWZD/NAIF-LOGO.jpg" alt="شعار نايف للأغذية" onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%23d32f2f%22%2F%3E%3Ctext%20x%3D%2210%22%20y%3D%2260%22%20fill%3D%22white%22%3E%D9%86%D8%A7%D9%8A%D9%81%3C%2Ftext%3E%3C%2Fsvg%3E';">
            <div class="company-name">شركة نايف للأغذية</div>
        </div>
        <div class="upload-area">
            <label class="file-label" for="fileInput">📂 تحميل ملف Excel</label>
            <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" />
            <span class="file-status" id="fileStatus">لم يتم رفع ملف بعد</span>
        </div>
    </div>

    <div class="action-buttons">
        <button id="exportExcelBtn" class="btn-excel" disabled>📎 تصدير كـ Excel</button>
        <button id="exportPdfBtn" class="btn-pdf" disabled>📄 تصدير كـ PDF</button>
    </div>

    <div id="reportContainer">
        <div class="report-table-wrapper" id="tableViewWrapper">
            <table class="summary-table" id="summaryTable">
                <thead>
                    <tr><th>#</th><th>اسم الصنف (RMName)</th><th>إجمالي الكمية المستهلكة</th><th>وحدة القياس (UoM)</th></tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="4" class="no-data-msg">📁 قم بتحميل ملف Excel لعرض التجميع</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <footer>
        * التقرير يجمع الكميات حسب "RMName" من عمود "Total Usage Qty" * جميع الكميات معبرة بالوحدة المرفقة
    </footer>
</div>
<a href="https://yasser-q8.github.io/myprofile/#" class="signature-card" target="_blank" rel="noopener noreferrer">
    <div class="name">Yasser Elkhateeb</div>
    <div class="title">مطور البرنامج 67011143</div>
</a>

<script>
    // --- المتغيرات العامة ---
    let aggregatedData = [];     // مصفوفة لتخزين { rmName, totalQty, uomName }
    let rawDataValid = false;

    // عناصر DOM
    const fileInput = document.getElementById('fileInput');
    const fileStatusSpan = document.getElementById('fileStatus');
    const exportExcelBtn = document.getElementById('exportExcelBtn');
    const exportPdfBtn = document.getElementById('exportPdfBtn');
    const tableBody = document.getElementById('tableBody');

    // ------------------- 1. قراءة و معالجة ملف Excel -------------------
    async function processExcelFile(file) {
        if (!file) return;
        fileStatusSpan.innerText = '⏳ جاري القراءة والمعالجة...';
        try {
            const data = await file.arrayBuffer();
            const workbook = XLSX.read(data, { type: 'array', cellDates: false, defval: "" });
            
            // البحث عن الورقة المناسبة: نفضل ورقة باسم "TheoreticalUsageVerificationDet" أو أي ورقة تحتوي على الأعمدة المطلوبة
            let targetSheet = null;
            let sheetName = "";
            if (workbook.SheetNames.includes("TheoreticalUsageVerificationDet")) {
                sheetName = "TheoreticalUsageVerificationDet";
                targetSheet = workbook.Sheets[sheetName];
            } else {
                // خذ أول ورقة غير فارغة كبداية
                for (let name of workbook.SheetNames) {
                    let sheet = workbook.Sheets[name];
                    if (sheet && !sheet['!ref']) continue;
                    targetSheet = sheet;
                    sheetName = name;
                    break;
                }
            }
            if (!targetSheet) throw new Error("لا توجد أوراق صالحة في الملف");

            // تحويل الورقة إلى مصفوفة ثنائية (صفوف)
            const rows = XLSX.utils.sheet_to_json(targetSheet, { header: 1, defval: "" });
            if (!rows || rows.length < 2) throw new Error("الملف لا يحتوي على بيانات كافية");

            // 1. العثور على صف العناوين الذي يحتوي على "RMName" و "Total Usage Qty"
            let headerRowIndex = -1;
            let colRMName = -1, colTotalQty = -1, colUom = -1;
            
            for (let i = 0; i < rows.length; i++) {
                const row = rows[i];
                if (!row || row.length === 0) continue;
                // تحويل كل خلية إلى نص للمقارنة
                let foundRM = false, foundQty = false;
                for (let c = 0; c < row.length; c++) {
                    let cellValue = (row[c] && typeof row[c] === 'string') ? row[c].toString().trim() : (row[c] ? row[c].toString().trim() : "");
                    if (cellValue === "RMName") {
                        colRMName = c;
                        foundRM = true;
                    }
                    if (cellValue === "Total Usage Qty") {
                        colTotalQty = c;
                        foundQty = true;
                    }
                    if (cellValue === "Uom Name") {
                        colUom = c;
                    }
                }
                if (foundRM && foundQty) {
                    headerRowIndex = i;
                    break;
                }
            }
            
            if (headerRowIndex === -1) {
                // محاولة مرنة: ابحث عن خلايا تحتوي "RMName" و "Total Usage Qty" بشكل غير دقيق (نص مشابه)
                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row) continue;
                    for (let c = 0; c < row.length; c++) {
                        let val = (row[c] && row[c].toString().trim()) || "";
                        if (val.includes("RMName") || val === "RMName") colRMName = c;
                        if (val.includes("Total Usage Qty") || val === "Total Usage Qty") colTotalQty = c;
                        if (val.includes("Uom Name") || val === "Uom Name") colUom = c;
                    }
                    if (colRMName !== -1 && colTotalQty !== -1) {
                        headerRowIndex = i;
                        break;
                    }
                }
            }
            
            if (colRMName === -1 || colTotalQty === -1) {
                throw new Error(`لم يتم العثور على عمودي 'RMName' و 'Total Usage Qty' في الورقة "${sheetName}". تأكد من وجودهما`);
            }
            
            // 2. تجميع البيانات من الصفوف التالية للعنوان
            const aggregationMap = new Map(); // key: rmName (string) , value: { totalQty: number, uom: string }
            
            for (let i = headerRowIndex + 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || row.length === 0) continue;
                let rmNameRaw = (row[colRMName] !== undefined && row[colRMName] !== null) ? row[colRMName].toString().trim() : "";
                if (rmNameRaw === "" || rmNameRaw === "RMName") continue; // تخطي الفارغ
                
                let qtyRaw = (row[colTotalQty] !== undefined && row[colTotalQty] !== null) ? row[colTotalQty] : 0;
                let qtyNumber = 0;
                if (typeof qtyRaw === 'number') qtyNumber = qtyRaw;
                else if (typeof qtyRaw === 'string') {
                    let cleaned = qtyRaw.replace(/[^0-9.\-]/g, '');
                    qtyNumber = parseFloat(cleaned);
                    if (isNaN(qtyNumber)) qtyNumber = 0;
                } else {
                    qtyNumber = 0;
                }
                if (qtyNumber === 0 && rmNameRaw !== "") {
                    // قد يكون صفر حقيقي، لا مشكلة
                }
                
                let uomValue = "";
                if (colUom !== -1 && row[colUom]) uomValue = row[colUom].toString().trim();
                
                if (aggregationMap.has(rmNameRaw)) {
                    let existing = aggregationMap.get(rmNameRaw);
                    existing.totalQty += qtyNumber;
                    // الاحتفاظ بأول وحدة موجودة (معظم البيانات متسقة)
                    if (existing.uom === "" && uomValue !== "") existing.uom = uomValue;
                } else {
                    aggregationMap.set(rmNameRaw, { totalQty: qtyNumber, uom: uomValue });
                }
            }
            
            if (aggregationMap.size === 0) {
                throw new Error("لا توجد بيانات صالحة للتجميع بعد تحليل الأعمدة.");
            }
            
            // تحويل الخريطة إلى مصفوفة مرتبة أبجدياً حسب اسم الصنف
            aggregatedData = Array.from(aggregationMap.entries()).map(([name, data]) => ({
                rmName: name,
                totalQty: data.totalQty,
                uomName: data.uom || "وحدة"
            })).sort((a,b) => a.rmName.localeCompare(b.rmName));
            
            rawDataValid = true;
            fileStatusSpan.innerHTML = `✅ تم التحميل والتجميع بنجاح | إجمالي الأصناف: ${aggregatedData.length} صنف`;
            renderTableToDOM();
            enableButtons(true);
        } catch (err) {
            console.error(err);
            fileStatusSpan.innerHTML = `❌ خطأ: ${err.message}`;
            aggregatedData = [];
            rawDataValid = false;
            renderEmptyTable();
            enableButtons(false);
        }
    }
    
    // عرض الجدول في DOM
    function renderTableToDOM() {
        if (!aggregatedData.length) {
            renderEmptyTable();
            return;
        }
        let html = '';
        aggregatedData.forEach((item, idx) => {
            // تنسيق الأرقام بدون فواصل عشرية زائدة
            let displayQty = Number.isInteger(item.totalQty) ? item.totalQty : item.totalQty.toFixed(2);
            html += `<tr>
                        <td>${idx+1}</td>
                        <td style="text-align:right; font-weight:500;">${escapeHtml(item.rmName)}</td>
                        <td>${displayQty}</td>
                        <td>${escapeHtml(item.uomName)}</td>
                     </tr>`;
        });
        // إضافة صف إجمالي العدد
        html += `<tr class="total-row"><td colspan="2" style="text-align:left;"><strong>📊 عدد الأصناف الفريدة</strong></td><td colspan="2"><strong>${aggregatedData.length}</strong></td></tr>`;
        tableBody.innerHTML = html;
    }
    
    function renderEmptyTable() {
        tableBody.innerHTML = `<tr><td colspan="4" class="no-data-msg">⚠️ لا توجد بيانات معروضة. يرجى رفع ملف Excel صالح.</td></tr>`;
    }
    
    function enableButtons(enable) {
        exportExcelBtn.disabled = !enable;
        exportPdfBtn.disabled = !enable;
    }
    
    // بسيط لمنع XSS
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }
    
    // ------------------- 2. تصدير إلى Excel -------------------
    function exportToExcel() {
        if (!rawDataValid || aggregatedData.length === 0) {
            alert("لا توجد بيانات مجمعة للتصدير، فضلاً قم بتحميل ملف Excel أولاً.");
            return;
        }
        // تحضير البيانات لعمل ورقة Excel جديدة
        const sheetData = [
            ["اسم الصنف (RMName)", "إجمالي الكمية المستهلكة", "وحدة القياس (UoM)"]
        ];
        aggregatedData.forEach(item => {
            sheetData.push([item.rmName, item.totalQty, item.uomName]);
        });
        // إضافة سطر إحصائيات
        sheetData.push(["", "", ""]);
        sheetData.push(["إجمالي عدد الأصناف الفريدة", aggregatedData.length, ""]);
        
        const newSheet = XLSX.utils.aoa_to_sheet(sheetData);
        // ضبط عرض الأعمدة بشكل بسيط
        newSheet['!cols'] = [{wch:35}, {wch:20}, {wch:20}];
        
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, newSheet, "تجميع_الأصناف");
        // إضافة ورقة ثانية معلومات الشركة (اختياري)
        const infoSheetData = [
            ["تقرير تجميع الكميات - شركة نايف للأغذية"],
            ["تاريخ التصدير:", new Date().toLocaleDateString('ar-KW')],
            ["إجمالي الأصناف", aggregatedData.length]
        ];
        const infoSheet = XLSX.utils.aoa_to_sheet(infoSheetData);
        XLSX.utils.book_append_sheet(workbook, infoSheet, "معلومات");
        
        XLSX.writeFile(workbook, `تقرير_تجميع_الاصناف_نايف_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.xlsx`);
    }
    
    // ------------------- 3. تصدير إلى PDF مع شعار واسم الشركة -------------------
    async function exportToPDF() {
        if (!rawDataValid || aggregatedData.length === 0) {
            alert("لا توجد بيانات كافية لإنشاء ملف PDF. الرجاء تحميل ملف Excel أولا.");
            return;
        }
        
        // إظهار رسالة تحميل (اختياري)
        const originalBtnText = exportPdfBtn.innerText;
        exportPdfBtn.innerText = "⏳ جاري إنشاء PDF...";
        exportPdfBtn.disabled = true;
        
        try {
            // إنشاء عنصر حاوية خاصة بـ PDF بحيث نضمن الهيدر والتذييل والجدول الجميل
            const pdfContainer = document.createElement('div');
            pdfContainer.style.width = '794px';   // عرض A4 تقريباً
            pdfContainer.style.background = '#ffffff';
            pdfContainer.style.padding = '20px 30px';
            pdfContainer.style.fontFamily = 'Cairo, "Segoe UI", Tahoma, Arial';
            pdfContainer.style.direction = 'rtl';
            pdfContainer.style.color = '#1e2a3a';
            
            // إضافة الرأس الخاص بالشركة
            const headerDiv = document.createElement('div');
            headerDiv.style.display = 'flex';
            headerDiv.style.alignItems = 'center';
            headerDiv.style.justifyContent = 'space-between';
            headerDiv.style.borderBottom = '3px solid #ffc107';
            headerDiv.style.paddingBottom = '15px';
            headerDiv.style.marginBottom = '25px';
            headerDiv.style.flexWrap = 'wrap';
            
            const logoImg = document.createElement('img');
            logoImg.src = 'https://i.postimg.cc/NM2zJWZD/NAIF-LOGO.jpg';
            logoImg.style.height = '65px';
            logoImg.style.width = 'auto';
            logoImg.style.objectFit = 'contain';
            logoImg.style.borderRadius = '12px';
            logoImg.style.background = '#fff3e0';
            logoImg.style.padding = '4px';
            logoImg.onerror = () => { logoImg.src = ''; logoImg.alt = 'شعار نايف'; };
            
            const titleSpan = document.createElement('div');
            titleSpan.style.fontSize = '1.8rem';
            titleSpan.style.fontWeight = 'bold';
            titleSpan.style.background = 'linear-gradient(135deg, #c0392b, #e67e22)';
            titleSpan.style.webkitBackgroundClip = 'text';
            titleSpan.style.backgroundClip = 'text';
            titleSpan.style.color = '#c0392b';
            titleSpan.innerText = 'شركة نايف للأغذية';
            
            const leftInfo = document.createElement('div');
            leftInfo.style.fontSize = '0.75rem';
            leftInfo.style.color = '#2c3e50';
            leftInfo.innerHTML = `تقرير تجميع الكميات<br>التاريخ: ${new Date().toLocaleDateString('ar-KW')}`;
            
            const logoTitleDiv = document.createElement('div');
            logoTitleDiv.style.display = 'flex';
            logoTitleDiv.style.alignItems = 'center';
            logoTitleDiv.style.gap = '15px';
            logoTitleDiv.appendChild(logoImg);
            logoTitleDiv.appendChild(titleSpan);
            
            headerDiv.appendChild(logoTitleDiv);
            headerDiv.appendChild(leftInfo);
            pdfContainer.appendChild(headerDiv);
            
            // إنشاء الجدول داخل PDF
            const tableElem = document.createElement('table');
            tableElem.style.width = '100%';
            tableElem.style.borderCollapse = 'collapse';
            tableElem.style.fontSize = '12px';
            tableElem.style.marginTop = '20px';
            tableElem.style.fontFamily = 'monospace';
            
            // رأس الجدول
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            ['#', 'اسم الصنف (RMName)', 'إجمالي الكمية', 'وحدة القياس'].forEach(text => {
                const th = document.createElement('th');
                th.innerText = text;
                th.style.backgroundColor = '#2c3e50';
                th.style.color = 'white';
                th.style.padding = '10px 8px';
                th.style.border = '1px solid #ddd';
                th.style.textAlign = 'center';
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            tableElem.appendChild(thead);
            
            const tbody = document.createElement('tbody');
            aggregatedData.forEach((item, idx) => {
                const tr = document.createElement('tr');
                const tdNum = document.createElement('td'); tdNum.innerText = (idx+1).toString(); tdNum.style.border = '1px solid #ddd'; tdNum.style.padding = '8px'; tdNum.style.textAlign = 'center';
                const tdName = document.createElement('td'); tdName.innerText = item.rmName; tdName.style.border = '1px solid #ddd'; tdName.style.padding = '8px'; tdName.style.textAlign = 'right';
                const tdQty = document.createElement('td'); tdQty.innerText = Number.isInteger(item.totalQty) ? item.totalQty : item.totalQty.toFixed(2); tdQty.style.border = '1px solid #ddd'; tdQty.style.padding = '8px'; tdQty.style.textAlign = 'center';
                const tdUom = document.createElement('td'); tdUom.innerText = item.uomName; tdUom.style.border = '1px solid #ddd'; tdUom.style.padding = '8px'; tdUom.style.textAlign = 'center';
                tr.appendChild(tdNum); tr.appendChild(tdName); tr.appendChild(tdQty); tr.appendChild(tdUom);
                tbody.appendChild(tr);
            });
            // صف الإجمالي
            const totalRow = document.createElement('tr');
            const totalCell = document.createElement('td'); totalCell.colSpan = 2; totalCell.innerText = 'إجمالي عدد الأصناف الفريدة'; totalCell.style.fontWeight = 'bold'; totalCell.style.backgroundColor = '#f1f9fe'; totalCell.style.border = '1px solid #ddd'; totalCell.style.padding = '8px';
            const totalValueCell = document.createElement('td'); totalValueCell.colSpan = 2; totalValueCell.innerText = aggregatedData.length.toString(); totalValueCell.style.fontWeight = 'bold'; totalValueCell.style.backgroundColor = '#f1f9fe'; totalValueCell.style.border = '1px solid #ddd'; totalValueCell.style.padding = '8px';
            totalRow.appendChild(totalCell); totalRow.appendChild(totalValueCell);
            tbody.appendChild(totalRow);
            tableElem.appendChild(tbody);
            pdfContainer.appendChild(tableElem);
            
            // إضافة تذييل بسيط (اختياري)
            const footerNote = document.createElement('div');
            footerNote.style.marginTop = '35px';
            footerNote.style.fontSize = '9px';
            footerNote.style.textAlign = 'center';
            footerNote.style.color = '#7f8c8d';
            footerNote.innerText = 'تم إنشاء هذا التقرير بواسطة نظام نايف للأغذية - جميع الكميات مجمعة حسب RMName';
            pdfContainer.appendChild(footerNote);
            
            // استخدام html2canvas لتحويل العنصر إلى صورة ثم PDF
            const canvas = await html2canvas(pdfContainer, { scale: 2, backgroundColor: '#ffffff' });
            const imgData = canvas.toDataURL('image/jpeg', 1.0);
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'pt', 'a4');
            const imgWidth = pdf.internal.pageSize.getWidth();
            const imgHeight = (canvas.height * imgWidth) / canvas.width;
            let position = 0;
            pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
            pdf.save(`تقرير_نايف_الأصناف_${new Date().toISOString().slice(0,19)}.pdf`);
        } catch (error) {
            console.error("PDF error: ", error);
            alert("حدث خطأ أثناء إنشاء PDF: " + error.message);
        } finally {
            exportPdfBtn.innerText = originalBtnText;
            exportPdfBtn.disabled = false;
        }
    }
    
    // ربط الأحداث
    fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
            processExcelFile(e.target.files[0]);
        } else {
            aggregatedData = [];
            renderEmptyTable();
            enableButtons(false);
            fileStatusSpan.innerText = "لم يتم اختيار ملف";
        }
    });
    
    exportExcelBtn.addEventListener('click', exportToExcel);
    exportPdfBtn.addEventListener('click', exportToPDF);
    
    // تهيئة أولية
    renderEmptyTable();
    enableButtons(false);
</script>
</body>
</html>
